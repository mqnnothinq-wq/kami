# Ana sunucu — paper-global.yml ÜZERİNE YAZILACAK anahtarlar (tam dosya değil; sürüm anahtarı bilerek yok).
# Burada olmayan anahtarlar Paper varsayılanında kalır. "mc apply" bunları sunucudaki
# dosyaya birleştirir (yorumlar birleştirmede taşınmaz; açıklamalar bu depodadır).
proxies:
  velocity:
    # Velocity modern iletimi açık: oyuncu adı/UUID/IP proxy'den imzalı gelir.
    enabled: true
    # Velocity'deki online-mode ile AYNI olmalı (karma giriş → false). false iken Paper
    # addan offline UUID üretir; bu da LibreLogin'in CRACKED UUID'leriyle eşleşir.
    online-mode: false
    # Sır dosyada TUTULMAZ: Paper PAPER_VELOCITY_SECRET ortam değişkenini okur
    # (/etc/minecraft/secrets.env, systemd). Burada boş kalmalı.
    secret: ''
chunk-system:
  # Parça (chunk) yükleme/üretme iş parçacıkları açıkça 2 (8 vCPU'da Paper'ın hesapladığı
  # değer de 2; VM'deki çekirdek algısına bağlı kalmasın). Dünya önceden üretilmemişse ve
  # spark'ta parça yükleme birikmesi görülürse 3 yapılabilir.
  worker-threads: 2
  # -1 = otomatik (1 G/Ç iş parçacığı).
  io-threads: -1
messages:
  # İzin yok mesajı Türkçe (MiniMessage biçimi).
  no-permission: '<red>Bu komutu kullanma yetkin yok.'
