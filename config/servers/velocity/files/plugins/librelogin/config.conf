# LibreLogin 0.25.0-SNAPSHOT (dev@39397c4) — karma giriş ayarları (HOCON biçimi).
# TAM dosya: "mc apply velocity" her seferinde bunu geri yazar. LibreLogin her açılışta
# dosyayı yeniden kaydeder ve yorumları İngilizceye çevirir; DEĞERLER korunur.
# "revision" SATIRINI SİLMEYİN: yoksa dosya revizyon 0 sayılır ve tüm göçler yeniden çalışır.
revision = 8

# Giriş yapmamış oyuncuların gönderileceği bekleme sunucusu (velocity.toml [servers]'da
# kayıtlı olmalı ve lobiyle AYNI olmamalı). PicoLimbo, 127.0.0.1:30065.
limbo = [ "limbo" ]

# Giriş yaptıktan sonra gidilecek sunucu. "root" = alan adına özel (forced host) olmayan
# bağlantılar. Forced host eklerseniz noktalar yerine § yazın: "survival§ornek§com" = [ "survival" ]
lobby {
  root = [ "lobby" ]
}

# Giriş yapmadan kullanılabilecek komutlar (2FA ve e-posta kapalı, onların komutları çıkarıldı).
allowed-commands-while-unauthorized = [ "login", "l", "log", "register", "reg" ]

# Şifre özeti: BCrypt (maliyet 10). Argon-2ID CPU'yu daha çok yorar.
default-crypto-provider = "BCrypt-2A"

# Yeni hesapların UUID'si: addan türetilen offline UUID (Paper online-mode=false ile tutarlı).
# YALNIZ YENİ hesapları etkiler, sonradan değiştirilemez gibidir: canlıya almadan önce karar verin.
new-uuid-creator = "CRACKED"

# Premium (Mojang'da kayıtlı) adları şifresiz otomatik kaydet ve ayır: cracked biri bu adları alamaz.
auto-register = true

# Ad çakışmasında (premium hesap başka bir hesabın adını almış) ikisini de engelle; yönetici çözer.
profile-conflict-resolution-strategy = "BLOCK"

# 5 yanlış şifrede at.
max-login-attempts = 5
# Yanlış deneme sayacının sıfırlanma süresi (ms).
milliseconds-to-refresh-login-attempts = 10000
# 90 saniyede giriş yapmayanı at (limbo'da ad işgalini de sınırlar).
seconds-to-authorize = 90
# Aynı IP'den 30 dk içinde yeniden gelen cracked oyuncu şifresiz girer. Kötüye kullanılırsa 0.
session-timeout = 1800
minimum-password-length = 6
# Aşağıdaki desen zaten 3-16 karakteri zorunlu kılıyor.
minimum-username-length = -1
# İzin verilen ad karakterleri: Türkçe harf (ç ğ ı ö ş ü) YOK — Minecraft adları ASCII'dir.
allowed-nickname-characters = "^[a-zA-Z0-9_]{3,16}$"
# IP başına hesap sınırı KAPALI: CGNAT / internet kafelerde çok kişi aynı IP'yi paylaşır.
ip-limit = -1

# Bekleyen oyuncuya başlık (title) göster; aksiyon çubuğu kapalı.
use-titles = true
use-action-bar = false
# Hatırlatma mesajı sıklığı (ms).
milliseconds-to-refresh-notification = 10000
# Sunucuları pingleyip doluluk denetleme (gereksiz).
ping-servers = false
ignore-max-players-from-backend-ping = false
# Son sunucuyu hatırlama (büyük ağlarda önerilmez).
remember-last-server = false
# survival'dan atılan/çöken oyuncu lobiye düşsün (false = bağlantı kesilir).
fallback = true
debug = false
# Yalnız Paper modunda etkili; Velocity'de etkisiz.
allow-proxy-connections = true
# Yalnız NanoLimboPlugin için (kurulu değil); 30065-30067 ve RCON portlarından uzak tutuldu.
limbo-port-range = "31000-31010"

database {
  # Tek dosyalı SQLite (plugins/librelogin/user-data.db). Tek proxy ve ~100 oyuncu için yeterli.
  # Bağlantı koparsa LibreLogin proxy'yi kapatır; MariaDB'ye bağlamak bu yüzden ek risk.
  type = "librelogin-sqlite"
  properties {
    sqlite {
      path = "user-data.db"
    }
    # MariaDB'ye geçmek için: install.sh ile "librelogin" veritabanını oluşturun
    # (network.env DB_DATABASES="luckperms librelogin"), type = "librelogin-mysql" yapın ve
    # veriyi migration.type = "librelogin-sqlite" ile BİR KEZ taşıyın.
    mysql {
      host = "@@DB_HOST@@"
      port = @@DB_PORT@@
      database = "librelogin"
      user = "@@DB_USER@@"
      password = "@@DB_PASSWORD@@"
      max-life-time = 600000
      jdbc-url = "jdbc:mariadb://%host%:%port%/%database%?autoReconnect=true&zeroDateTimeBehavior=convertToNull"
    }
  }
}

migration {
  on-next-startup = false
  # Eski bir AuthMe veritabanı varsa bunu ayarlayıp on-next-startup = true yapın (BİR KEZ).
  type = "authme-sqlite"
}

totp {
  # İki adımlı doğrulama Protocolize ister; 26.x uyumu doğrulanmadı → kapalı.
  enabled = false
  label = "Kami Minecraft Ağı"
  delay = 1000
}

mail {
  # E-postayla şifre sıfırlama kapalı (SMTP gerekmez, daha az kişisel veri toplanır).
  enabled = false
}
