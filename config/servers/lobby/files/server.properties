# Lobi — server.properties ÜZERİNE YAZILACAK anahtarlar (tam dosya değil).
# "mc apply" bu anahtarları sunucudaki dosyada değiştirir, diğer satırlara dokunmaz.
# Değerlerin sonuna yorum YAZMAYIN (properties biçiminde satır sonu yorumu değerin parçası olur).

# --- Ağ ve güvenlik (tüm backend'lerde aynı) ---
# Yalnız yerel dinle: oyuncular YALNIZ Velocity üzerinden gelebilir.
server-ip=127.0.0.1
server-port=@@PORT@@
# Doğrulamayı proxy (Velocity + LibreLogin) yapar; backend'de kapalı olmak ZORUNDA.
online-mode=false
# Bedrock (Geyser) ve cracked oyuncuların sohbet edebilmesi için imzalı profil zorunlu değil.
enforce-secure-profile=false
# Backend doğrulama yapmadığı için anlamsız; kapalı.
prevent-proxy-connections=false
# 127.0.0.1 hattında sıkıştırma yok (sıkıştırmayı proxy bir kez yapar; CPU tasarrufu).
network-compression-threshold=-1
# Beyaz liste kapalı. 26.3'ten itibaren varsayılan true olduğu için açıkça yazıldı.
white-list=false
# Query (UDP durum sorgusu) kapalı.
enable-query=false
# RCON: yedekleme (save-off/save-all) ve "mc rcon" için açık, ama YALNIZ 127.0.0.1'de.
enable-rcon=true
rcon.ip=127.0.0.1
rcon.port=@@RCON_PORT@@
rcon.password=@@RCON_PASSWORD@@
# RCON komutları oyundaki yöneticilere yansımasın.
broadcast-rcon-to-ops=false
# IP'ler proxy'de zaten var; aynı kişisel veriyi burada tekrar yazma (KVKK).
log-ips=false
# Yeni yönetim (management) sunucusu kapalı.
management-server-enabled=false
# Transfer paketiyle gelen oyuncuları kabul etme.
accepts-transfers=false

# --- Lobiye özel ---
# Tek bir spawn alanında çok oyuncu var ama az şey işleniyor: düşük görüş/simülasyon mesafesi.
view-distance=6
simulation-distance=3
max-players=150
# Macera modu: blok kırılamaz/konamaz (oynanışı değiştirir). Giriş yapan herkes bu moda alınır.
gamemode=adventure
force-gamemode=true
# Barışçıl: canavar yok, açlık azalmaz.
difficulty=peaceful
# Yalnız dünya İLK OLUŞTURULURKEN etkili: yapısız düz (flat) dünya.
generate-structures=false
level-type=minecraft\:flat
