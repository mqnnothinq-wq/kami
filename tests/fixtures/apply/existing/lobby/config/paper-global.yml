# This is the global configuration file for Paper.
# Paper'ın yazdığı başlık yorumu korunmalı.
_version: 31
chunk-system:
  gen-parallelism: default
  # G/Ç iş parçacıkları
  io-threads: -1
  worker-threads: -1
misc:
  compression-level: default
  max-joins-per-tick: 5
proxies:
  bungee-cord:
    online-mode: true
  velocity:
    enabled: false
    online-mode: true
    secret: ''
