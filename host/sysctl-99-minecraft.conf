# Kurulum yeri: /etc/sysctl.d/99-minecraft.conf  (install.sh kopyalar, `sysctl --system` uygular)
# Çekirdek varsayılanları 100 oyuncuya büyük ölçüde yeter; bunlar kuyruk/tampon payı ve bellek davranışı içindir.
# DDoS süzmesi üst akışta (sağlayıcı) yapılır; burada yalnızca SYN taşmasına karşı temel önlem var.

# Bağlantı kuyrukları
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_syncookies = 1
net.core.netdev_max_backlog = 16384

# Soket tamponları (Velocity/Geyser yoğun trafik)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_slow_start_after_idle = 0
# velocity.toml'da tcp-fast-open=true ise işe yarar; değilse zararsız
net.ipv4.tcp_fastopen = 3

# İsteğe bağlı: fq + BBR (çekirdek modülü yoksa `sysctl --system` bu iki satır için uyarı verir, gerisi uygulanır)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Bellek: swap yalnızca OOM'a karşı emniyet ağı; Java yığını takasa düşerse GC duraklamaları uzar
vm.swappiness = 1
vm.max_map_count = 262144
