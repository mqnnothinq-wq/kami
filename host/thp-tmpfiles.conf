# Kurulum yeri: /etc/tmpfiles.d/minecraft-thp.conf  (her açılışta systemd-tmpfiles uygular)
# Şeffaf büyük sayfalar (THP) yalnız isteyen süreçlere (madvise): JVM'de -XX:+UseTransparentHugePages
# denenirse etkili olur, diğer süreçlerde (MariaDB vb.) gecikme sıçramalarına yol açmaz.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
