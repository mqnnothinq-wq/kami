# Kurulum yeri: /etc/needrestart/conf.d/minecraft.conf
# Ubuntu 24.04'te needrestart, otomatik (unattended) güncellemeden sonra servisleri kendiliğinden
# yeniden başlatır; bu da oyuncuları rastgele bir saatte atar. Minecraft sunucuları ve MariaDB
# otomatik yeniden başlatmadan çıkarılır; kütüphane/JDK güncellemeleri günlük 05:00 yeniden
# başlatmasında (mc-daily-restart.timer) ya da duyurulu bakımda devreye girer.
$nrconf{override_rc}{qr(^mc@.+\.service$)} = 0;
$nrconf{override_rc}{qr(^mariadb\.service$)} = 0;
