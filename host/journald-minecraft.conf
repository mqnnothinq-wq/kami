# Kurulum yeri: /etc/systemd/journald.conf.d/minecraft.conf
# Sunucu konsolları journald'a yazar (mc log <srv>). Disk kullanımı ve saklama süresi sınırlanır.
# MaxRetentionSec, network.env LOG_RETENTION_DAYS (varsayılan 90) ile uyumlu tutulmalı (KVKK: yazılı saklama süresi).
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=4G
MaxRetentionSec=90day
